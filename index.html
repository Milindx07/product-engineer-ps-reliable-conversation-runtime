<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reliable Conversation Runtime</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        color: #18202b;
        font-family: Arial, sans-serif;
      }

      main {
        max-width: 680px;
        padding: 28px;
        border: 1px solid #d8dde6;
        background: white;
      }

      h1 {
        margin-top: 0;
      }

      code {
        display: block;
        padding: 12px;
        background: #111827;
        color: #e5e7eb;
        overflow-wrap: anywhere;
      }

      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reliable Conversation Runtime</h1>
      <p>
        This project is a Node.js/TypeScript runtime, so the live demo must be
        started from the server. Double-click <strong>start-live-demo.bat</strong>
        or run this command:
      </p>
      <code>npm run live</code>
      <p>
        Then open <a href="http://localhost:5173">http://localhost:5173</a>.
      </p>
    </main>
  </body>
</html>
